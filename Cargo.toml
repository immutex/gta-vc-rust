[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
authors = ["immutex <immutexx@gmail.com>"]

[workspace.dependencies]
anyhow = "1.0.104"
bevy = { version = "0.20.0", default-features = false, features = [
  "bevy_asset",
  "bevy_render",
  "bevy_core_pipeline",
  "bevy_pbr",
  "bevy_post_process",
  "bevy_anti_alias",
  "bevy_winit",
  "bevy_window",
  "bevy_log",
  "x11",
  "bevy_ui",
  "bevy_ui_render",
  "bevy_text",
  "default_font",
  "bevy_sprite",
  "multi_threaded",
  "png",
] }
blake3 = "1.8.7"
bytemuck = "1.25.2"
clap = "4.6.7"
cpal = "0.18.2"
dirs = "7.0.0"
glam = "0.33.12"
half = "2.7.1"
memmap2 = "0.9.12"
parry3d = "0.31.1"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde = "1.0.229"
symphonia = "0.6.1"
thiserror = "2.0.21"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

# Workspace crates, declared here so member manifests stay uniform. The version
# repeats [workspace.package] on purpose: a path-only dependency reads as a
# wildcard requirement, which `cargo deny` (rightly) rejects.
rw_stream = { version = "0.1.0", path = "crates/rw_stream" }
vc_col = { version = "0.1.0", path = "crates/vc_col" }
vc_dff = { version = "0.1.0", path = "crates/vc_dff" }
vc_ide = { version = "0.1.0", path = "crates/vc_ide" }
vc_ipl = { version = "0.1.0", path = "crates/vc_ipl" }
vc_game = { version = "0.1.0", path = "crates/vc_game" }
vc_paths = { version = "0.1.0", path = "crates/vc_paths" }
vc_physics = { version = "0.1.0", path = "crates/vc_physics" }
vc_render = { version = "0.1.0", path = "crates/vc_render" }
vc_stream = { version = "0.1.0", path = "crates/vc_stream" }
vc_cook = { version = "0.1.0", path = "crates/vc_cook" }
vc_timecyc = { version = "0.1.0", path = "crates/vc_timecyc" }
vc_transport = { version = "0.1.0", path = "crates/vc_transport" }
vc_txd = { version = "0.1.0", path = "crates/vc_txd" }
vc_world = { version = "0.1.0", path = "crates/vc_world" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unused_must_use = "deny"
nonstandard_style = { level = "deny", priority = 10 }
rust_2018_idioms = { level = "deny", priority = 10 }
future_incompatible = { level = "deny", priority = 10 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = 10 }
pedantic = { level = "warn", priority = 9 }
nursery = { level = "warn", priority = 8 }

# Engine code is numeric by nature; these fire on nearly every cast and add no signal.
cast_precision_loss = { level = "allow", priority = 11 }
cast_possible_truncation = { level = "allow", priority = 11 }
cast_sign_loss = { level = "allow", priority = 11 }

# Naming and attribute noise that costs more than it catches.
module_name_repetitions = { level = "allow", priority = 11 }
must_use_candidate = { level = "allow", priority = 11 }

# Binary crates have no exported surface, so `pub(crate)` inside a private module
# is exactly what we mean. `unreachable_pub` still guards library crates.
redundant_pub_crate = { level = "allow", priority = 11 }

[profile.dev]
opt-level = 1
# Full debuginfo for Bevy comes to about 40 GB of target directory. Line tables are
# enough to get a backtrace with file and line, and keep the profile an order of
# magnitude smaller.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.perf]
inherits = "release"
debug = "line-tables-only"
strip = "none"
