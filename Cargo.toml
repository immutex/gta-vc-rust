[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
authors = ["immutex <immutexx@gmail.com>"]

[workspace.dependencies]
anyhow = "1.0.104"
bevy = { version = "0.20.0", default-features = false, features = [
  "bevy_asset",
  "bevy_render",
  "bevy_core_pipeline",
  "bevy_pbr",
  "bevy_post_process",
  "bevy_anti_alias",
  "bevy_winit",
  "bevy_ui",
  "bevy_ui_render",
  "bevy_text",
  "bevy_sprite",
  "bevy_gilrs",
  "multi_threaded",
  "png",
] }
blake3 = "1.8.7"
bytemuck = "1.25.2"
clap = "4.6.7"
cpal = "0.18.2"
dirs = "7.0.0"
glam = "0.33.12"
half = "2.7.1"
memmap2 = "0.9.12"
parry3d = "0.31.1"
postcard = "1.1.3"
serde = "1.0.229"
symphonia = "0.6.1"
thiserror = "2.0.21"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unused_must_use = "deny"
nonstandard_style = { level = "deny", priority = 10 }
rust_2018_idioms = { level = "deny", priority = 10 }
future_incompatible = { level = "deny", priority = 10 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = 10 }
pedantic = { level = "warn", priority = 9 }
nursery = { level = "warn", priority = 8 }

# Engine code is numeric by nature; these fire on nearly every cast and add no signal.
cast_precision_loss = { level = "allow", priority = 11 }
cast_possible_truncation = { level = "allow", priority = 11 }
cast_sign_loss = { level = "allow", priority = 11 }

# Naming and attribute noise that costs more than it catches.
module_name_repetitions = { level = "allow", priority = 11 }
must_use_candidate = { level = "allow", priority = 11 }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.perf]
inherits = "release"
debug = "line-tables-only"
strip = "none"
